# Render Blueprint for the Leash API and frontend. Spec: https://render.com/docs/blueprint-spec
#
# The Postgres database (leash-db, Oregon) already exists and isn't declared here, so its plan is
# set in the dashboard only. It's on a paid plan: a free Render Postgres expires 30 days after it's
# created. Its URL goes in DATABASE_URL by hand (use the Internal Database URL, same region).

services:
  - type: web
    name: leash-api
    runtime: python
    # the $7/month instance (0.5 CPU, 512 MB). paid instances never spin down, so judges don't wait
    # a minute for the first request. this has to match the dashboard, or a Blueprint sync puts the
    # service back on the free plan
    plan: 0.5c-512mb
    # same region as leash-db so the internal database URL works
    region: oregon
    branch: main
    # deploy on every push to main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    # preDeployCommand is paid-plan only, so migrations run right before uvicorn starts.
    # if a migration fails, uvicorn never starts and the deploy fails its health check
    startCommand: alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # sync: false means Render asks for the value in the dashboard and never reads it
      # from this file
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_API_KEYS
        sync: false
      - key: AGENT_API_KEY
        sync: false
      - key: MERCHANT_API_KEY
        sync: false
      - key: DEMO_MERCHANT_PASSWORD
        sync: false
      - key: DEMO_VAULT_ID
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com

  # the dashboard and confirm page. a static site lives on Render's global CDN, so it takes no
  # region or plan (both are unsupported for static sites)
  - type: web
    name: leash-frontend
    runtime: static
    branch: main
    autoDeployTrigger: commit
    # build command and publish path both run from here, not the repo root
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Vite bakes these into the bundle at build time, so changing one needs a rebuild, not just
    # a redeploy. neither is a secret, they end up in the public JS anyway
    envVars:
      - key: VITE_API_URL
        value: https://leash-api-q3rw.onrender.com
      - key: VITE_USE_MOCKS
        value: "false"
      # AG Grid Enterprise trial key (row grouping). set it in the Render dashboard, never in git.
      # it still lands in the public JS, that's how AG Grid keys work
      - key: VITE_AG_GRID_LICENSE_KEY
        sync: false
    routes:
      # it's a single-page app: /dashboard and /confirm/<token> only exist in the browser, so
      # every path serves index.html. real files like /assets/*.js still win, Render only
      # rewrites paths that don't exist
      - type: rewrite
        source: /*
        destination: /index.html
